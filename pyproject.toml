[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "upload-module"
version = "0.1.0"
description = "Python upload and quarantine module"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pip-tools>=7.4,<8.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
